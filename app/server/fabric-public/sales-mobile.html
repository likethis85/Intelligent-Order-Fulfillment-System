    // ============================================================
    // 文字生成（核心逻辑与原版一致）
    // ============================================================
    function buildPerSkcTextMap() {
      const fabricIds = Object.keys(selectedFabrics);
      const sharedMap = findSharedFabricMap(fabricIds.map(id => ({ itemId: id, fabric: selectedFabrics[id] })));
      const pdtGroups = {};
      fabricIds.forEach(itemId => {
        const fabric = selectedFabrics[itemId];
        const pdtCode = fabric.pdt_code || '未分类';
        if (!pdtGroups[pdtCode]) pdtGroups[pdtCode] = [];
        pdtGroups[pdtCode].push(fabric);
      });
      const incomplete = [];
      const perSkcText = {};
      const skcPdt = {};
      Object.keys(pdtGroups).sort().forEach(pdtCode => {
        const items = pdtGroups[pdtCode];
        const skcGroups = {};
        items.forEach(fabric => {
          const skc = fabric.sku_code || fabric.skuCode || fabric.mt_code || '';
          if (!skcGroups[skc]) skcGroups[skc] = [];
          skcGroups[skc].push(fabric);
        });
        Object.keys(skcGroups).sort().forEach(skc => {
          const skcItems = skcGroups[skc];
          const pdtColorName = skcItems[0].pdt_color_name || '';
          const seg = getSkuInfoSegments(skcItems.map(f => ({ itemId: '', fabric: f })));
          const main = seg.main ? seg.main.fabric : null;
          if (!main || isLiningFabric(main)) return;
          const batches = Array.isArray(main.sales_batches) ? main.sales_batches : [];
          let sharedInfo = null;
          if (sharedMap && sharedMap.size > 0) {
            const key = (main.mt_code || '') + '||' + (main.mt_spec_name || '');
            if (sharedMap.has(key)) sharedInfo = sharedMap.get(key);
          }
          const maxNum = sharedInfo && sharedInfo.maxMap ? Math.floor((sharedInfo.maxMap[skc] || 0) / 10) * 10 : 0;
          const splitFallback = (sharedInfo && sharedInfo.splitPieces > 0) ? Math.floor(sharedInfo.splitPieces / 10) * 10 : 0;
          let p1 = main.sales_pieces || 0;
          const d1 = main.sales_delivery_days || 0;
          const userHasAnyPlan = p1 > 0 || d1 > 0 || batches.some(b => (Number(b.pieces) || 0) > 0 || (Number(b.days) || 0) > 0);
          if (d1 === 0 && p1 > 0) incomplete.push(`${skc} ${pdtColorName} 第1批：填了件数${p1}件，未填天数`);
          else if (p1 === 0 && d1 > 0) incomplete.push(`${skc} ${pdtColorName} 第1批：填了天数${d1}天，未填件数`);
          const hasPlan = userHasAnyPlan;
          if (!hasPlan) return;
          let line = `${pdtColorName}`;
          if (p1 > 0 || d1 > 0) {
            if (d1 > 0 && p1 > 0) line += ` ${p1}件${d1}天`;
            else if (p1 > 0) line += ` ${p1}件`;
            else line += ` ${d1}天`;
          }
          batches.forEach((batch, i) => {
            const p = batch.pieces || 0;
            const d = batch.days || 0;
            if (d === 0 && p > 0) incomplete.push(`${skc} ${pdtColorName} 第${i + 2}批：填了件数${p}件，未填天数`);
            else if (p === 0 && d > 0) incomplete.push(`${skc} ${pdtColorName} 第${i + 2}批：填了天数${d}天，未填件数`);
            if (p > 0 || d > 0) {
              if (d > 0 && p > 0) line += ` ${p}件${d}天`;
              else if (p > 0) line += ` ${p}件`;
              else line += ` ${d}天`;
            }
          });
          if (maxNum > 0) line += ` 最大单量${maxNum}件`;
          perSkcText[skc] = line;
          skcPdt[skc] = pdtCode;
        });
      });
      return { perSkcText, incomplete, skcPdt };
    }

    function applyPlanTextPostProcess(lines) { return [...lines]; }

    function extractPiecesDays(line) {
      const m = String(line || '').match(/(\d+)\s*(件|套)(?:\s*(\d+)\s*天)?/);
      if (!m) return null;
      return { pieces: parseInt(m[1], 10) || 0, days: m[3] ? (parseInt(m[3], 10) || 0) : 0 };
    }

    function validatePlanPiecesDays() {
      const errors = [];
      const hasTaoPdt = Object.values(selectedFabrics).some(f =>
        (f && PLAN_UNIT_TAO_PDTS && PLAN_UNIT_TAO_PDTS.has(f.pdt_code || f.pdtCode || ''))
      );
      if (hasTaoPdt) return errors;
      const { perSkcText } = buildPerSkcTextMap();
      const textarea = document.getElementById('textResult');
      const lines = ((textarea && textarea.value) || '').split('\n');
      const skcKeys = Object.keys(perSkcText);
      lines.forEach((userLine, i) => {
        const skc = skcKeys[i];
        if (!skc) return;
        const stdLine = perSkcText[skc];
        const std = extractPiecesDays(stdLine);
        const usr = extractPiecesDays(userLine);
        if (std && std.pieces > 0) {
          if (!usr || usr.pieces !== std.pieces || usr.days !== std.days) {
            const want = (std.pieces > 0 && std.days > 0) ? `${std.pieces}件${std.days}天` : `${std.pieces}件`;
            errors.push(`第${i + 1}行(${skc})：件数/天数与上方输入框不一致，应为「${want}」`);
          }
        }
      });
      return errors;
    }

    async function generateText() {
      const fabricIds = Object.keys(selectedFabrics);
      if (fabricIds.length === 0) { alert('请先勾选面料'); return; }
      const { perSkcText, incomplete, skcPdt } = buildPerSkcTextMap();
      const lines = applyPlanTextPostProcess(Object.values(perSkcText), skcPdt);
      window._lastPerSkcText = perSkcText;
      if (incomplete.length > 0) {
        alert(`以下批次翻单信息不完整，无法生成翻单文字：\n\n${incomplete.join('\n')}\n\n请补全天数或件数后再提交。`);
        renderFabricList();
        return;
      }
      const textareaEl = document.getElementById('textResult');
      const text = (_manualEdited && textareaEl && textareaEl.value && textareaEl.value.trim())
        ? textareaEl.value : lines.join('\n');
      if (textareaEl) textareaEl.value = text;
      Object.values(selectedFabrics).forEach(fab => {
        const id = fab.id || `${fab.pdt_code}_${fab.mt_code}_${fab.warehouse}`;
        const target = fabricData.find(x => (x.id || `${x.pdt_code}_${x.mt_code}_${x.warehouse}`) === id);
        if (target) {
          if (Number(fab.sales_pieces)) target.sales_pieces = Number(fab.sales_pieces);
          if (Number(fab.sales_delivery_days)) target.sales_delivery_days = Number(fab.sales_delivery_days);
          if (Array.isArray(fab.sales_batches)) target.sales_batches = fab.sales_batches;
        } else fabricData.push({ ...fab });
      });
      renderFabricList();
      await flushPendingSaves();
      const touchedPdts = [...new Set(Object.values(selectedFabrics).map(f => (f && (f.pdt_code || f.pdtCode)) || '').filter(Boolean))];
      const syncItems = [];
      const allSkcs = [];
      const seenSyncItemKeys = new Set();
      Object.values(selectedFabrics).forEach(fab => {
        if (!fab) return;
        const skc = fab.sku_code || fab.skuCode || '';
        const pdt = fab.pdt_code || fab.pdtCode || '';
        if (!skc || !pdt) return;
        const color = fab.pdt_color_name || fab.colorName || '';
        if (!allSkcs.includes(skc)) allSkcs.push(skc);
        let batches = Array.isArray(fab.sales_batches) ? fab.sales_batches.slice() : [];
        if (batches.length === 0 && (Number(fab.sales_pieces) > 0 || Number(fab.sales_delivery_days) > 0)) {
          batches = [{ pieces: Number(fab.sales_pieces) || 0, days: Number(fab.sales_delivery_days) || 0 }];
        }
        batches.forEach(b => {
          const p = Number(b.pieces) || 0;
          const d = Number(b.days) || 0;
          if (p > 0 || d > 0) {
            const key = `${pdt}|${skc}|${p}|${d}`;
            if (!seenSyncItemKeys.has(key)) {
              seenSyncItemKeys.add(key);
              syncItems.push({ pdt, skc, color, pieces: p, days: d, _source: fab._source || 'craft' });
            }
          }
        });
      });
      try { await syncToDingtalk(touchedPdts, syncItems, allSkcs, text, perSkcText); } catch (e) { console.error('[generateText] 同步异常:', e && e.message); }
    }

    async function syncToDingtalk(pdtCodes, items, allSkcs, fullText, perSkcText) {
      const maxRetries = 3;
      let lastError;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          console.log(`[syncToDingtalk] 第${attempt}次尝试, 款:`, pdtCodes || [], 'item数:', (items || []).length);
          const res = await authFetch('/api/dingtalk-sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pdt_codes: pdtCodes || [], items: items || [], all_skcs: allSkcs || [], full_text: fullText || '', per_skc_text: perSkcText || {} })
          });
          const result = await res.json();
          if (result.success) {
            console.log(`[syncToDingtalk] 第${attempt}次尝试成功: 更新${result.updatedCount}, 追加${result.appendedCount}, 清空${result.clearedCount}`);
            return;
          } else {
            console.error(`[syncToDingtalk] 第${attempt}次尝试失败:`, result.error);
            lastError = result.error;
          }
        } catch (err) {
          console.error(`[syncToDingtalk] 第${attempt}次尝试异常:`, err.message);
          lastError = err;
        }
        if (attempt < maxRetries) {
          await new Promise(r => setTimeout(r, attempt * 1000));
        }
      }
      console.error('[syncToDingtalk] 重试3次均失败:', lastError);
    }

    async function copyText() {
      const { perSkcText: curPerSkcText, skcPdt: _curSkcPdt } = buildPerSkcTextMap();
      const textarea = document.getElementById('textResult');
      let text = (textarea && textarea.value) ? textarea.value : '';
      if (!text.trim()) {
        text = applyPlanTextPostProcess(Object.values(curPerSkcText), _curSkcPdt || {}).join('\n');
        if (textarea) textarea.value = text;
      }
      if (!text.trim()) { alert('请先确认翻单信息'); return; }
      const showTip = () => {
        const tip = document.getElementById('copyTip');
        tip.textContent = '已复制到剪贴板';
        tip.classList.add('show');
        setTimeout(() => tip.classList.remove('show'), 1500);
      };
      const fallbackCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch {}
        document.body.removeChild(ta);
        showTip();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(text); showTip(); }
        catch { fallbackCopy(); }
      } else fallbackCopy();
    }

    // ============================================================
    // 勾选 & 共用面料
    // ============================================================
    let pendingToggle = null;

    function toggleGroup(pdtCode, checked) {
      const pdtItems = fabricData.filter(f => f.pdt_code === pdtCode);
      const group = document.querySelector(`.pdt-card[data-pdt="${pdtCode}"]`);
      if (group) {
        const cb = group.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = checked;
        group.classList.toggle('selected', checked);
      }
      if (checked) {
        if (pdtItems.length === 0 && !forceAddedPdts.has(pdtCode)) { forceAddPdtCode(pdtCode); return; }
        const selectedItems = Object.values(selectedFabrics);
        const sharedFabrics = detectSharedFabrics(selectedItems, pdtItems);
        if (sharedFabrics.length > 0) {
          pendingToggle = { pdtCode, checked: true, items: pdtItems };
          showSharedFabricModal(sharedFabrics);
          return;
        }
        addGroupToSelection(pdtCode, pdtItems);
      } else {
        removeGroupFromSelection(pdtCode, pdtItems);
      }
      renderEditRows();
      refreshTextForSelection();
    }

    function detectSharedFabrics(existingItems, newItems) {
      const allItems = [...existingItems, ...newItems];
      const nonLiningItems = allItems.filter(item => !isLiningFabric(item) && (item.mt_code || item.mtCode || '') !== '_forced_');
      const mtKeyMap = new Map();
      nonLiningItems.forEach(item => {
        const mtCode = item.mt_code || item.mtCode || '';
        const mtSpec = item.mt_spec_name || item.mtSpecName || '';
        const skc = item.sku_code || item.skuCode || '';
        const pdtCode = item.pdt_code || '未分类';
        const key = mtCode + '||' + mtSpec;
        if (!mtKeyMap.has(key)) mtKeyMap.set(key, []);
        mtKeyMap.get(key).push({ item, skc, pdtCode, mtCode, mtSpec });
      });
      const sharedFabrics = [];
      mtKeyMap.forEach((items, key) => {
        const uniquePdtCodes = new Set(items.map(i => i.pdtCode));
        if (uniquePdtCodes.size > 1) {
          const byPdtCode = {};
          items.forEach(i => {
            if (!byPdtCode[i.pdtCode]) byPdtCode[i.pdtCode] = [];
            if (i.skc && !byPdtCode[i.pdtCode].includes(i.skc)) byPdtCode[i.pdtCode].push(i.skc);
          });
          sharedFabrics.push({
            mtCode: items[0].mtCode, mtSpec: items[0].mtSpec,
            mtName: items[0].item.mt_name || items[0].item.mtName || items[0].mtCode,
            pdtCodes: byPdtCode
          });
        }
      });
      return sharedFabrics;
    }

    function showSharedFabricModal(sharedFabrics) {
      const modal = document.getElementById('sharedFabricModal');
      const list = document.getElementById('sharedFabricList');
      list.innerHTML = sharedFabrics.map(f => {
        const pdtLines = Object.entries(f.pdtCodes).map(([pdt, skcs]) => `  • ${pdt}: ${skcs.join(', ')}`).join('<br>');
        return `<li><strong>${escapeHtml(f.mtCode)}</strong> ${escapeHtml(f.mtSpec)}<br>被 ${Object.keys(f.pdtCodes).length} 个款号共用:<br>${pdtLines}</li>`;
      }).join('');
      modal.classList.add('show');
    }

    function handleSharedFabric(action) {
      const modal = document.getElementById('sharedFabricModal');
      modal.classList.remove('show');
      if (!pendingToggle) return;
      const { pdtCode, items } = pendingToggle;
      pendingToggle = null;
      if (action === 'cancel') {
        const group = document.querySelector(`.pdt-card[data-pdt="${pdtCode}"]`);
        if (group) { const cb = group.querySelector('input[type="checkbox"]'); if (cb) cb.checked = false; group.classList.remove('selected'); }
        return;
      }
      const group = document.querySelector(`.pdt-card[data-pdt="${pdtCode}"]`);
      if (group) { const cb = group.querySelector('input[type="checkbox"]'); if (cb) cb.checked = true; group.classList.add('selected'); }
      addGroupToSelection(pdtCode, items);
      renderEditRows();
      refreshTextForSelection();
    }

    function addGroupToSelection(pdtCode, items) {
      items.forEach(item => {
        const itemId = item.id || `${item.pdt_code}_${item.mt_code}_${item.warehouse}`;
        selectedFabrics[itemId] = item;
      });
    }

    function removeGroupFromSelection(pdtCode, items) {
      items.forEach(item => {
        const itemId = item.id || `${item.pdt_code}_${item.mt_code}_${item.warehouse}`;
        delete selectedFabrics[itemId];
      });
    }

    function closePdtInEditor(pdtCode) {
      Object.keys(selectedFabrics).forEach(itemId => {
        const f = selectedFabrics[itemId];
        if (f && (f.pdt_code || f.pdtCode) === pdtCode) delete selectedFabrics[itemId];
      });
      const group = document.querySelector(`.pdt-card[data-pdt="${pdtCode}"]`);
      if (group) { const cb = group.querySelector('input[type="checkbox"]'); if (cb) cb.checked = false; group.classList.remove('selected'); }
      renderEditRows();
      refreshTextForSelection();
    }

    // ============================================================
    // 导出
    // ============================================================
    function formatLiveDate(input) {
      const s = String(input || '').trim();
      const m = s.match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?$/);
      if (m) return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
      const d = new Date(s);
      if (!isNaN(d.getTime())) return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
      return s;
    }

    let pendingExportData = null;

    function exportAllFilledData() {
      const filledData = fabricData.filter(item => {
        if (item.sales_pieces > 0 || item.sales_delivery_days > 0) return true;
        const batches = Array.isArray(item.sales_batches) ? item.sales_batches : [];
        return batches.some(b => (b.pieces > 0 || b.days > 0));
      });
      if (filledData.length === 0) { alert('暂无已填写的翻单信息'); return; }
      pendingExportData = filledData;
      document.getElementById('liveDateInput').value = '';
      document.getElementById('liveDateModal').classList.add('show');
    }

    function cancelLiveDate() {
      document.getElementById('liveDateModal').classList.remove('show');
      pendingExportData = null;
    }

    function confirmLiveDate() {
      const input = document.getElementById('liveDateInput').value;
      if (!input) { alert('请先选择直播日期'); return; }
      const liveDate = formatLiveDate(input);
      performExport(liveDate);
      cancelLiveDate();
    }

    function performExport(liveDate) {
      const filledData = pendingExportData || [];
      const allItems = filledData.map(fabric => {
        const itemId = Object.keys(selectedFabrics).find(id => {
          const sf = selectedFabrics[id];
          return sf && sf.pdt_code === fabric.pdt_code &&
            (sf.sku_code || sf.skuCode || '') === (fabric.sku_code || fabric.skuCode || '') &&
            sf.mt_code === fabric.mt_code &&
            (sf.mt_spec_name || '') === (fabric.mt_spec_name || '');
        }) || (fabric.id || '');
        return { itemId, fabric };
      });
      const sharedMap = findSharedFabricMap(allItems);
      const pdtGroups = {};
      filledData.forEach(item => {
        const pdtCode = item.pdt_code || '未分类';
        if (!pdtGroups[pdtCode]) pdtGroups[pdtCode] = [];
        pdtGroups[pdtCode].push(item);
      });
      const headers = ['款号', 'SKC', '计划翻单量', '翻单周期', '最大单量', '直播日期', '成衣颜色'];
      const rows = [];
      Object.keys(pdtGroups).sort().forEach(pdtCode => {
        const items = pdtGroups[pdtCode];
        const skcGroups = {};
        items.forEach(fabric => {
          const skc = fabric.sku_code || fabric.skuCode || '';
          if (!skcGroups[skc]) skcGroups[skc] = [];
          skcGroups[skc].push(fabric);
        });
        Object.keys(skcGroups).sort().forEach(skc => {
          const skcItems = skcGroups[skc];
          const pdtColorName = skcItems[0].pdt_color_name || '';
          const { main } = getSkuInfoSegments(skcItems.map(f => ({ itemId: '', fabric: f })));
          const m = main ? main.fabric : skcItems[0];
          let sharedInfo = null;
          if (sharedMap && sharedMap.size > 0) {
            const key = (m.mt_code || '') + '||' + (m.mt_spec_name || '');
            if (sharedMap.has(key)) sharedInfo = sharedMap.get(key);
          }
          const maxNum = sharedInfo && sharedInfo.maxMap ? sharedInfo.maxMap[skc] || 0 : 0;
          const splitFallback = (sharedInfo && sharedInfo.splitPieces > 0) ? sharedInfo.splitPieces : 0;
          const batchRows = (p, d) => {
            if (p > 0 || d > 0) rows.push([pdtCode, skc, p || '', d > 0 ? `${d}天之内` : '', maxNum || '', liveDate, pdtColorName]);
          };
          let p1 = m.sales_pieces || 0;
          if (p1 === 0 && splitFallback > 0) p1 = splitFallback;
          batchRows(p1, m.sales_delivery_days || 0);
          const batches = Array.isArray(m.sales_batches) ? m.sales_batches : [];
          batches.forEach(b => batchRows(b.pieces || 0, b.days || 0));
        });
      });
      const BOM = '﻿';
      const csvContent = BOM + [headers, ...rows].map(row => row.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `翻单信息汇总_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function handleLogout() {
      if (!confirm('确定要退出登录吗？')) return;
      await fetch('/api/auth/logout', { method: 'POST' });
      await supabaseClient.auth.signOut();
      window.location.href = '/login.html';
    }
  </script>
