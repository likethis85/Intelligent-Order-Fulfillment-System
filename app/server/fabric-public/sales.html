      return { perSkcText, incomplete, skcPdt };
    }

    // 生成翻单文字后处理：不再自动转换单位/跨款合并（回归手动）
    // 程序默认生成「件」、各 SKC 独立成行；用户需要「套」/合并时在文本框手动修改，保存即用。
    function applyPlanTextPostProcess(lines) {
      return [...lines];
    }

    // 从一行翻单文字中提取「件数+天数」（兼容单位「件」和「套」，取第1个匹配；无匹配返回 null）
    // 校验只看数值是否与输入框一致，不区分件/套单位
    function extractPiecesDays(line) {
      const m = String(line || '').match(/(\d+)\s*(件|套)(?:\s*(\d+)\s*天)?/);
      if (!m) return null;
      return { pieces: parseInt(m[1], 10) || 0, days: m[3] ? (parseInt(m[3], 10) || 0) : 0 };
    }

    // 校验文本框里每行的「件数/天数」是否与当前款每个 SKC 上部输入框(件数/天数)一致。
    // 返回不一致的提示数组；为空表示全部一致。
    // 注意：若当前选中的款涉及套款（件→套合并、行数与SKC不再逐行对应），跳过校验，避免误报。
    function validatePlanPiecesDays() {
      const errors = [];
      // 是否含套款：含则套款合并导致行数/单位变化，逐行校验已不适用 → 跳过
      const hasTaoPdt = Object.values(selectedFabrics).some(f =>
        (f && PLAN_UNIT_TAO_PDTS.has(f.pdt_code || f.pdtCode || ''))
      );
      if (hasTaoPdt) return errors;

      const { perSkcText } = buildPerSkcTextMap();
      const textarea = document.getElementById('textResult');
      const lines = ((textarea && textarea.value) || '').split('\n');
      const skcKeys = Object.keys(perSkcText); // 有翻单计划、会生成行的 SKC（顺序与文字行一致）
      lines.forEach((userLine, i) => {
        const skc = skcKeys[i];
        if (!skc) return;
        const stdLine = perSkcText[skc]; // 该 SKC 应由输入框生成的正确行
        const std = extractPiecesDays(stdLine);
        const usr = extractPiecesDays(userLine);
        // 只有正确行含件数/天数才需要校验（纯颜色行无意义）
        if (std && std.pieces > 0) {
          if (!usr || usr.pieces !== std.pieces || usr.days !== std.days) {
            const want = (std.pieces > 0 && std.days > 0) ? `${std.pieces}件${std.days}天` : `${std.pieces}件`;
            errors.push(`第${i + 1}行(${skc})：件数/天数与上方输入框不一致，应为「${want}」`);
          }
        }
      });
      return errors;
    }

    // 生成翻单文字并显示
    async function generateText() {
      console.log('[generateText] clicked, selectedFabrics keys:', Object.keys(selectedFabrics).length);
      const fabricIds = Object.keys(selectedFabrics);
      if (fabricIds.length === 0) {
        alert('请先勾选面料');
        return;
      }

      // 用当前已勾选款(selectedFabrics)实时计算每个SKC的单行翻单文字 + 未填完整提示
      // （基于当前款，绝不使用上一次生成的残留）
      const { perSkcText, incomplete, skcPdt } = buildPerSkcTextMap();
      console.log('[generateText] perSkcText size:', Object.keys(perSkcText).length, 'incomplete:', incomplete);
      // 后处理：指定款件→套、同色同数据去重
      const lines = applyPlanTextPostProcess(Object.values(perSkcText), skcPdt);
      // 供"确认并复制翻单文字"写入钉钉I列使用（当前款的准确映射）
      window._lastPerSkcText = perSkcText;

      if (incomplete.length > 0) {
        alert(`以下批次翻单信息不完整，无法生成翻单文字：\n\n${incomplete.join('\n')}\n\n请补全天数或件数后再提交。`);
        // 已填/未填可能因本次编辑而变化，刷新左侧状态栏
        renderFabricList();
        return;
      }

      // 文字生成逻辑：
      //   - 用户手动改过文本框架(_manualEdited) → 保留用户修改（如自己写的"套"、备注）
      //   - 未手动改（文本框是程序上次生成或为空）→ 用最新 lines 重新生成（确保新增批次/改件数能体现在文字里）
      const textareaEl = document.getElementById('textResult');
      const text = (_manualEdited && textareaEl && textareaEl.value && textareaEl.value.trim())
        ? textareaEl.value
        : lines.join('\n');
      // 注意：文字可以为空（重置清空翻单后，仍要走下面的同步，把钉钉里对应 SKC 行删掉/清空）
      if (textareaEl) textareaEl.value = text;
      // 把编辑区(selectedFabrics)的最新翻单值同步回 fabricData，确保左侧已填/未填状态立即刷新
      Object.values(selectedFabrics).forEach(fab => {
        const id = fab.id || `${fab.pdt_code}_${fab.sku_code || ''}_${fab.mt_code}_${fab.warehouse}`;
        const target = fabricData.find(x => (x.id || `${x.pdt_code}_${x.sku_code || ''}_${x.mt_code}_${x.warehouse}`) === id);
        if (target) {
          if (Number(fab.sales_pieces)) target.sales_pieces = Number(fab.sales_pieces);
          if (Number(fab.sales_delivery_days)) target.sales_delivery_days = Number(fab.sales_delivery_days);
          if (Array.isArray(fab.sales_batches)) target.sales_batches = fab.sales_batches;
        } else {
          fabricData.push({ ...fab });
        }
      });
      // 确认后刷新左侧"已填/未填"计数与分组
      renderFabricList();
      // 先确保所有防抖中的保存已完成，再同步，避免数据库竞态
      await flushPendingSaves();
      // 确认后自动同步翻单信息到钉钉（只同步本次勾选的款）
      const touchedPdts = [...new Set(Object.values(selectedFabrics).map(f => (f && (f.pdt_code || f.pdtCode)) || '').filter(Boolean))];
      console.log('[generateText] 勾选款号:', touchedPdts);
      // 组装本次勾选 SKC 的最新翻单值（从 selectedFabrics 内存读，避免数据库保存竞态）
      // 治本：只读 sales_batches，不再单独 push 主行（主行 = batches[0]，已同步）
      const syncItems = [];
      const allSkcs = []; // 本次款下所有 SKC（含无翻单的，用于后端判定是否删行）
      const seenSyncItemKeys = new Set();
      Object.values(selectedFabrics).forEach(fab => {
        if (!fab) return;
        const skc = fab.sku_code || fab.skuCode || '';
        const pdt = fab.pdt_code || fab.pdtCode || '';
        if (!skc || !pdt) { console.log('[sync] 跳过记录(缺skc/pdt):', JSON.stringify({id:(fab.id||'').slice(0,8), skc, pdt, sp:fab.sales_pieces, dd:fab.sales_delivery_days})); return; }
        const color = fab.pdt_color_name || fab.colorName || '';
        if (!allSkcs.includes(skc)) allSkcs.push(skc);
        // 统一从 sales_batches 数组取所有批次；旧数据若 batches 为空但主行有值，自动补一个
        let batches = Array.isArray(fab.sales_batches) ? fab.sales_batches.slice() : [];
        if (batches.length === 0 && (Number(fab.sales_pieces) > 0 || Number(fab.sales_delivery_days) > 0)) {
          batches = [{ pieces: Number(fab.sales_pieces) || 0, days: Number(fab.sales_delivery_days) || 0 }];
        }
        batches.forEach(b => {
          const p = Number(b.pieces) || 0;
          const d = Number(b.days) || 0;
          if (p > 0 || d > 0) {
            const key = `${pdt}|${skc}|${p}|${d}`;
            if (!seenSyncItemKeys.has(key)) {
              seenSyncItemKeys.add(key);
              syncItems.push({ pdt, skc, color, pieces: p, days: d, _source: fab._source || 'craft' });
            }
          }
        });
      });
      console.log('[generateText] syncItems:', syncItems.length, 'allSkcs:', allSkcs);
      console.log('[generateText] 即将同步到钉钉 touchedPdts=', JSON.stringify(touchedPdts), 'syncItems=', JSON.stringify(syncItems));
      // 同步并带上翻单文字（完整整段 + 每SKC单行），供写入钉钉 I/J 列
      let syncOk = false;
      try {
        const syncResult = await syncToDingtalk(touchedPdts, syncItems, allSkcs, text, perSkcText);
        console.log('[generateText] 同步调用完成', syncResult);
        syncOk = syncResult && syncResult.ok;
      } catch (e) {
        console.error('[generateText] 同步调用异常:', e && e.message, e);
      }
      // 同步成功 → 清空文案 + 短暂提示 + 重置手动编辑标记（让下次编辑能正常刷新）
      if (syncOk) {
        const ta = document.getElementById('textResult');
        if (ta) ta.value = '';
        _manualEdited = false;
        // 在按钮上方插一个"✓ 已同步"提示，3秒后消失
        try {
          const actionsRow = document.querySelector('.actions-row');
          if (actionsRow) {
            let tip = document.getElementById('syncOkTip');
            if (!tip) {
              tip = document.createElement('div');
              tip.id = 'syncOkTip';
              tip.style.cssText = 'margin-bottom:8px;padding:6px 12px;background:#dcfce7;color:#16a34a;border-radius:4px;font-size:12px;font-weight:600;';
              actionsRow.parentNode.insertBefore(tip, actionsRow);
            }
            tip.textContent = '✓ 已同步到钉钉 + 货盘，文案已清空';
            clearTimeout(window._syncOkTipTimer);
            window._syncOkTipTimer = setTimeout(() => { try { tip.remove(); } catch {} }, 3000);
          }
        } catch (e) { console.warn('[generateText] 显示同步提示失败:', e); }
      } else {
        try {
          alert('同步到钉钉失败，请重试或检查网络');
        } catch {}
      }
      // 同步至货盘（postMessage 给 opener / parent：TraysPage 会写入 tray.restockOverrides + tray.plannedRestockBySkc）
      try {
        const _touchedPdts = [...new Set(Object.values(selectedFabrics).map((f) => (f && (f.pdt_code || f.pdtCode)) || '').filter(Boolean))];
        // 按 pdt_code 分组生成各自的翻单文案（西装 vs 裤的色卡不能混在一起——TraysPage 显示时会按 pid 加产品短名前缀）
        // 用 skcPdt 把 perSkcText 反向映射到 pdt，再做同色同数据去重
        const textByPdt = {};
        const pdtSkcLists = {};
        for (const skc of Object.keys(perSkcText)) {
          const pdt = skcPdt[skc] || '';
          if (!pdt) continue;
          if (!pdtSkcLists[pdt]) pdtSkcLists[pdt] = [];
          pdtSkcLists[pdt].push(skc);
        }
        for (const pdt of Object.keys(pdtSkcLists)) {
          const skcsForPdt = pdtSkcLists[pdt];
          const linesForPdt = skcsForPdt.map(skc => perSkcText[skc]).filter(Boolean);
          const processed = applyPlanTextPostProcess(linesForPdt, skcPdt);
          textByPdt[pdt] = processed.join('\n');
        }
        // DEBUG: 看 pdt 分组为什么空
        console.log('[generateText DEBUG] perSkcText size:', Object.keys(perSkcText).length, 'skcPdt size:', Object.keys(skcPdt).length);
        console.log('[generateText DEBUG] perSkcText sample:', JSON.stringify(Object.entries(perSkcText).slice(0, 2)));
        console.log('[generateText DEBUG] skcPdt:', JSON.stringify(skcPdt));
        console.log('[generateText DEBUG] pdtSkcLists:', JSON.stringify(pdtSkcLists));
        const _payload = {
          type: 'restock-selected',
          source: 'sales-page',
          pids: _touchedPdts,
          // 结构化数据：[{ pdt, skc, color, pieces, days }, ...] —— TraysPage 写入 plannedRestockBySkc，导出 Excel 用
          items: syncItems,
          all_skcs: allSkcs,
          // 按款号分组的翻单文案：TraysPage 写 restockOverrides[pid] 时用它，坑位里西装/裤就不会共用同一段文字
          text_by_pdt: textByPdt,
          payload: { text, timestamp: Date.now() },
        };
        console.log('[generateText] 发送 postMessage: pids=', _touchedPdts, 'text_by_pdt keys=', Object.keys(textByPdt), 'full text lines=', text ? text.split('\n').length : 0);
        console.log('[generateText] text_by_pdt=', JSON.stringify(textByPdt, null, 2));
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(_payload, '*');
        }
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(_payload, '*');
        }
      } catch (e) {
        console.warn('[generateText] postMessage 给货盘失败:', e);
      }
    }

    // 同步翻单信息到钉钉"计划翻单量"表（后端代理调 dws）
    // pdtCodes: 本次勾选款号; items: 各SKC最新翻单值(件数/天数/颜色); allSkcs: 本次款下所有SKC(含清零的)
    // fullText: 完整翻单文字（业务员改后的整段，写钉钉J列）; perSkcText: skc->单行文字(写钉钉I列)
    async function syncToDingtalk(pdtCodes, items, allSkcs, fullText, perSkcText) {
      const maxRetries = 3;
      let lastError;
      for (let attempt = 1; attempt <= maxRetries; attempt++) {
        try {
          console.log(`[syncToDingtalk] 第${attempt}次尝试, 款:`, pdtCodes || [], 'item数:', (items || []).length);
          const res = await authFetch('/api/dingtalk-sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pdt_codes: pdtCodes || [],
              items: items || [],
              all_skcs: allSkcs || [],
              full_text: fullText || '',
              per_skc_text: perSkcText || {}
            })
          });
          const result = await res.json();
          if (result.success) {
            console.log(`[syncToDingtalk] 第${attempt}次尝试成功: 更新${result.updatedCount}, 追加${result.appendedCount}, 清空${result.clearedCount}`);
            console.log('[syncToDingtalk] 已同步到钉钉"计划翻单量"表');
            return { ok: true, updated: result.updatedCount || 0, appended: result.appendedCount || 0, cleared: result.clearedCount || 0 };
          } else {
            console.error(`[syncToDingtalk] 第${attempt}次尝试失败:`, result.error);
            lastError = result.error;
          }
        } catch (err) {
          console.error(`[syncToDingtalk] 第${attempt}次尝试异常:`, err.message);
          lastError = err;
        }
        // 失败则等待后重试
        if (attempt < maxRetries) {
          await new Promise(r => setTimeout(r, attempt * 1000));
        }
      }
      console.error('[syncToDingtalk] 重试3次均失败:', lastError);
      return { ok: false, error: lastError };
    }

    // 复制文字（读取业务员可编辑的 textarea 内容，修改后也能复制）
    async function copyText() {
      // 实时计算当前已勾选款的每SKC单行文字（绝不使用上次生成/其他款的残留）
      const { perSkcText: curPerSkcText, skcPdt: _curSkcPdt } = buildPerSkcTextMap();

      const textarea = document.getElementById('textResult');
      let text = (textarea && textarea.value) ? textarea.value : '';
      // 若还未生成文字（比如直接打开已填翻单信息、没先点"确认翻单信息"），
      // 自动用当前款生成并填入，使"确认并复制"等同"先确认再复制"
      if (!text.trim()) {
        text = applyPlanTextPostProcess(Object.values(curPerSkcText), _curSkcPdt || {}).join('\n');
        if (textarea) textarea.value = text;
      }
      if (!text.trim()) {
        alert('请先确认翻单信息');
        return;
      }

      // 复制到剪贴板（兼容 navigator.clipboard 不可用的情况，用 textarea+execCommand 兜底）
      const showTip = () => {
        const tip = document.getElementById('copyTip');
        tip.textContent = '已复制到剪贴板';
        tip.classList.add('show');
        setTimeout(() => tip.classList.remove('show'), 1500);
      };
      const fallbackCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch {}
        document.body.removeChild(ta);
        showTip();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(text); showTip(); }
        catch { fallbackCopy(); }
      } else {
        fallbackCopy();
      }
    }

    // 登出
    async function handleLogout() {
      if (!confirm('确定要退出登录吗？')) return;
      await fetch('/api/auth/logout', { method: 'POST' });
      if (supabaseClient?.auth) {
        try { await supabaseClient.auth.signOut(); } catch (e) {}
      }
      window.location.reload();
    }

    // ========== 新功能：共用面料检测 ==========

    let pendingToggle = null; // 待处理的勾选操作
    let sharedFabricMode = 'independent'; // 'independent' | 'shared'

    // 选择/取消整组（检测共用面料）
    // 样衣 BOM 按需合并：只对指定款号调主仓 /api/samples/materials（全量拉会触发领猫限流）
    // 驼色等未转大货 SKC 以 _source='sample' 行并入 fabricData
    const sampleBomMergedCodes = new Set();
    async function mergeSampleBomForCodes(codes) {
      const todo = (codes || []).map(c => String(c || '').trim().toUpperCase()).filter(c => c && !sampleBomMergedCodes.has(c));
      if (todo.length === 0) return false;
      todo.forEach(c => sampleBomMergedCodes.add(c)); // 先占位防重入；失败时移除允许重试
      try {
        const sampleUrl = '/api/samples/materials?codes=' + encodeURIComponent(todo.join(','));
        const sResp = await fetch(sampleUrl);
        const sJson = await sResp.json();
        const sampleItems = (sJson && sJson.items) || [];
        const sampleRows = [];
        for (const r of sampleItems) {
          if (r.fabricMt) sampleRows.push({
            pdt_code: r.smCode,
            sku_code: r.skc,
            color_name: r.colorName,
            pdt_color_name: r.colorName,
            mt_name: r.fabricMt,
            mt_type: '面料',
            mt_code: '__sample_fabric__',
            mt_spec_name: r.mtSpecName,
            use_amt: r.useAmt,
            supplier_name: r.supplierShort,
            warehouse: '-',
            stock: 0, in_transit_qty: 0, factory_spot_qty: 0, orderable_qty: 0, lead_time_days: 0,
            _source: 'sample',
          });
          if (r.liningMt) sampleRows.push({
            pdt_code: r.smCode,
            sku_code: r.skc,
            color_name: r.colorName,
            pdt_color_name: r.colorName,
            mt_name: r.liningMt,
            mt_type: '里料',
            mt_code: '__sample_lining__',
            mt_spec_name: r.mtSpecName,
            use_amt: r.useAmt,
            supplier_name: r.supplierShort,
            warehouse: '-',
            stock: 0, in_transit_qty: 0, factory_spot_qty: 0, orderable_qty: 0, lead_time_days: 0,
            _source: 'sample',
          });
        }
        if (sampleRows.length > 0) {
          fabricData = fabricData.concat(sampleRows);
          allPdtCodes = [...new Set(fabricData.map(r => r.pdt_code))].filter(Boolean).sort();
          renderFabricList();
          console.log('[mergeSampleBom] 合并样衣 BOM:', todo.join(','), sampleRows.length, '条');
          return true;
        }
        return false;
      } catch (e) {
        todo.forEach(c => sampleBomMergedCodes.delete(c));
        console.warn('[mergeSampleBom] 失败（非阻断）:', e.message);
        return false;
      }
    }

    function toggleGroup(pdtCode, checked) {
      const pdtItems = fabricData.filter(f => f.pdt_code === pdtCode);

      // 更新 checkbox 状态
      const group = document.querySelector(`.fabric-group[data-pdt="${pdtCode}"]`);
      if (group) {
        const cb = group.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = checked;
      }

      if (checked) {
        // 懒合并样衣 BOM：首次勾选该款时把驼色等未转大货 SKC 从主仓拉进来，合并后重走勾选流程
        if (!sampleBomMergedCodes.has(pdtCode)) {
          mergeSampleBomForCodes([pdtCode]).then((added) => {
            if (added) toggleGroup(pdtCode, true);
          });
        }
        // 若是该款没有任何面料记录（批量搜出来的待强制添加占位）→ 自动强制添加创建真实记录
        if (pdtItems.length === 0 && !forceAddedPdts.has(pdtCode)) {
          forceAddPdtCode(pdtCode);
          return;
        }
        // 收集所有已选中的面料数据
        const selectedItems = Object.values(selectedFabrics);

        // 检测已选中款号和正要勾选的款号之间是否有共用面料
        const sharedFabrics = detectSharedFabrics(selectedItems, pdtItems);
        if (sharedFabrics.length > 0) {
          // 保存待处理的操作，显示弹窗
          pendingToggle = { pdtCode, checked: true, items: pdtItems };
          showSharedFabricModal(sharedFabrics);
          return;
        }
        // 没有共用面料，直接勾选
        addGroupToSelection(pdtCode, pdtItems);
      } else {
        removeGroupFromSelection(pdtCode, pdtItems);
      }
      renderEditRows();
      // 勾选/取消勾选后：若选中款组合变化，自动生成当前款文字并清掉旧款残留
      refreshTextForSelection();
    }

    // 检测共用面料（比较两组面料，找出不同款号之间共用的面料）
    // 判定标准：(mt_code, mt_spec_name) 相同 = 同一面料
    function detectSharedFabrics(existingItems, newItems) {
      // 合并已选中和新增的面料
      const allItems = [...existingItems, ...newItems];
      // console.log('[DEBUG] detectSharedFabrics: existing=', existingItems.length, 'new=', newItems.length, 'pdtCodes:', [...new Set(allItems.map(i => i.pdt_code))]);

      // 里布过滤掉（里布共用不算，只提示面料）；_forced_ 占位记录(无面料)不算共用
      const nonLiningItems = allItems.filter(item => !isLiningFabric(item) && (item.mt_code || item.mtCode || '') !== '_forced_');

      const mtKeyMap = new Map(); // key=mtCode+'||'+mtSpec -> [{item, skc, pdtCode}]
      nonLiningItems.forEach(item => {
        const mtCode = item.mt_code || item.mtCode || '';
        const mtSpec = item.mt_spec_name || item.mtSpecName || '';
        const skc = item.sku_code || item.skuCode || '';
        const pdtCode = item.pdt_code || '未分类';
        const key = mtCode + '||' + mtSpec;
        if (!mtKeyMap.has(key)) mtKeyMap.set(key, []);
        mtKeyMap.get(key).push({ item, skc, pdtCode, mtCode, mtSpec });
      });

      // 找出被多个不同款号使用的面料
      const sharedFabrics = [];
      mtKeyMap.forEach((items, key) => {
        const uniquePdtCodes = new Set(items.map(i => i.pdtCode));
        // 只有当被多个不同款号使用时才算共用
        if (uniquePdtCodes.size > 1) {
          const byPdtCode = {};
          items.forEach(i => {
            if (!byPdtCode[i.pdtCode]) byPdtCode[i.pdtCode] = [];
            if (i.skc && !byPdtCode[i.pdtCode].includes(i.skc)) {
              byPdtCode[i.pdtCode].push(i.skc);
            }
          });
          sharedFabrics.push({
            mtCode: items[0].mtCode,
            mtSpec: items[0].mtSpec,
            mtName: items[0].item.mt_name || items[0].item.mtName || items[0].mtCode,
            pdtCodes: byPdtCode
          });
        }
      });

      // console.log('[DEBUG] detectSharedFabrics 结果:', sharedFabrics);
      return sharedFabrics;
    }

    // 显示共用面料弹窗
    function showSharedFabricModal(sharedFabrics) {
      const modal = document.getElementById('sharedFabricModal');
      const list = document.getElementById('sharedFabricList');

      list.innerHTML = sharedFabrics.map(f => {
        const pdtLines = Object.entries(f.pdtCodes).map(([pdt, skcs]) =>
          `  • ${pdt}: ${skcs.join(', ')}`
        ).join('<br>');
        return `<li><strong>${escapeHtml(f.mtCode)}</strong> ${escapeHtml(f.mtSpec)}<br>被 ${Object.keys(f.pdtCodes).length} 个款号共用:<br>${pdtLines}</li>`;
      }).join('');

      modal.classList.add('show');
      // console.log('[DEBUG] showSharedFabricModal called, pendingToggle:', pendingToggle);
    }

    // 处理共用面料弹窗选择
    function handleSharedFabric(action) {
      // console.log('[DEBUG] handleSharedFabric called, action:', action, 'pendingToggle:', pendingToggle);
      const modal = document.getElementById('sharedFabricModal');
      modal.classList.remove('show');

      if (!pendingToggle) return;

      const { pdtCode, items } = pendingToggle;
      pendingToggle = null;

      if (action === 'cancel') {
        // 取消勾选
        const group = document.querySelector(`.fabric-group[data-pdt="${pdtCode}"]`);
        if (group) {
          const cb = group.querySelector('input[type="checkbox"]');
          if (cb) cb.checked = false;
        }
        return;
      }

      // 知道了，继续勾选（只是提示，不影响实际填写逻辑）
      // 确保 checkbox 勾上
      const group = document.querySelector(`.fabric-group[data-pdt="${pdtCode}"]`);
      // console.log('[DEBUG] handleSharedFabric group found:', !!group);
      if (group) {
        const cb = group.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = true;
      }
      addGroupToSelection(pdtCode, items);
      renderEditRows();
      refreshTextForSelection();
    }

    // 添加组到选区
    // 主仓货盘回传的已保存翻单批次（样衣行不落 Supabase，重开弹窗时靠它回填）
    // 消息可能在样衣 BOM 合并完成前到达，所以先存 map，addGroupToSelection 时才应用
    const restockPrefillBySkc = new Map(); // skc(大写) → [{pieces, days}, ...]
    window.addEventListener('message', (ev) => {
      const d = ev.data;
      if (!d || d.type !== 'restock-prefill' || !Array.isArray(d.items)) return;
      for (const it of d.items) {
        const skc = String(it.skc || '').toUpperCase();
        if (!skc) continue;
        if (!restockPrefillBySkc.has(skc)) restockPrefillBySkc.set(skc, []);
        restockPrefillBySkc.get(skc).push({ pieces: Number(it.pieces) || 0, days: Number(it.days) || 0 });
      }
      // 消息可能晚于勾选到达：已选中的样衣行立即回填并重渲染
      applyRestockPrefillToRows(Object.values(selectedFabrics));
      renderEditRows();
    });
    function applyRestockPrefillToRows(items) {
      items.forEach(item => {
        if (item._source !== 'sample') return;
        const skc = String(item.sku_code || '').toUpperCase();
        const batches = restockPrefillBySkc.get(skc);
        if (!batches || batches.length === 0) return;
        if (Array.isArray(item.sales_batches) && item.sales_batches.length > 0) return; // 已有值不覆盖
        item.sales_batches = batches.map(b => ({ ...b }));
        item.sales_pieces = batches[0].pieces;
        item.sales_delivery_days = batches[0].days;
      });
    }

    function addGroupToSelection(pdtCode, items) {
      applyRestockPrefillToRows(items);
      items.forEach(item => {
        const itemId = item.id || `${item.pdt_code}_${item.sku_code || ''}_${item.mt_code}_${item.warehouse}`;
        selectedFabrics[itemId] = item;
      });
    }

    // 从选区移除组
    function removeGroupFromSelection(pdtCode, items) {
      items.forEach(item => {
        const itemId = item.id || `${item.pdt_code}_${item.sku_code || ''}_${item.mt_code}_${item.warehouse}`;
        delete selectedFabrics[itemId];
      });
    }

    // 右侧编辑区关闭某款：把该款从已选中移除（等同取消勾选），并刷新编辑区/文字/左侧勾选态
    function closePdtInEditor(pdtCode) {
      // 1. 从 selectedFabrics 移除该款所有行的选中
      Object.keys(selectedFabrics).forEach(itemId => {
        const f = selectedFabrics[itemId];
        if (f && (f.pdt_code || f.pdtCode) === pdtCode) {
          delete selectedFabrics[itemId];
        }
      });

      // 2. 清除左侧该款的勾选状态
      const group = document.querySelector(`.fabric-group[data-pdt="${pdtCode}"]`);
      if (group) {
        const cb = group.querySelector('input[type="checkbox"]');
        if (cb) cb.checked = false;
      }

      // 3. 重渲染右侧编辑区（若已无选中的款会隐藏编辑区并显示空状态）
      renderEditRows();
      // 4. 刷新翻单文字（组合变化→自动生成剩余款文字或清空；保留手动/校验机制）
      refreshTextForSelection();
    }

    // ========== 新功能：导出所有已填写数据 ==========

    // 把用户输入的日期格式化成 YYYY/M/D（去前导零：2026/09/06 -> 2026/9/6）
    function formatLiveDate(input) {
      const s = String(input || '').trim();
      const m = s.match(/^(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?$/);
      if (m) return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
      const d = new Date(s);
      if (!isNaN(d.getTime())) return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
      return s;
    }

    let pendingExportData = null;

    function exportAllFilledData() {
      // 筛选已填写的面料
      const filledData = fabricData.filter(item => {
        if (item.sales_pieces > 0 || item.sales_delivery_days > 0) return true;
        const batches = Array.isArray(item.sales_batches) ? item.sales_batches : [];
        return batches.some(b => (b.pieces > 0 || b.days > 0));
      });

      if (filledData.length === 0) {
        alert('暂无已填写的翻单信息');
        return;
      }

      // 弹出直播日期选择器，不输入不导出
      pendingExportData = filledData;
      document.getElementById('liveDateInput').value = '';
      document.getElementById('liveDateModal').classList.add('show');
    }

    function cancelLiveDate() {
      document.getElementById('liveDateModal').classList.remove('show');
      pendingExportData = null;
    }

    function confirmLiveDate() {
      const input = document.getElementById('liveDateInput').value; // 形如 "2026-09-06"
      if (!input) {
        alert('请先选择直播日期');
        return;
      }
      const liveDate = formatLiveDate(input);
      performExport(liveDate);
      cancelLiveDate();
    }

    // 真正生成并下载 CSV（每个批次一行）
    function performExport(liveDate) {
      const filledData = pendingExportData || [];

      // 计算共享面料 map（基于所有已填面料，跨款检测共用关系）
      const allItems = filledData.map(fabric => {
        const itemId = Object.keys(selectedFabrics).find(id => {
          const sf = selectedFabrics[id];
          return sf && sf.pdt_code === fabric.pdt_code &&
            (sf.sku_code || sf.skuCode || '') === (fabric.sku_code || fabric.skuCode || '') &&
            sf.mt_code === fabric.mt_code &&
            (sf.mt_spec_name || '') === (fabric.mt_spec_name || '');
        }) || (fabric.id || '');
        return { itemId, fabric };
      });
      const sharedMap = findSharedFabricMap(allItems);

      // 按款号分组
      const pdtGroups = {};
      filledData.forEach(item => {
        const pdtCode = item.pdt_code || '未分类';
        if (!pdtGroups[pdtCode]) pdtGroups[pdtCode] = [];
        pdtGroups[pdtCode].push(item);
      });

      // Excel 列：款号 | SKC | 计划翻单量 | 翻单周期 | 最大单量 | 直播日期 | 成衣颜色；每个批次一行
      const headers = ['款号', 'SKC', '计划翻单量', '翻单周期', '最大单量', '直播日期', '成衣颜色'];
      const rows = [];

      Object.keys(pdtGroups).sort().forEach(pdtCode => {
        const items = pdtGroups[pdtCode];

        // 按 SKC 分组
        const skcGroups = {};
        items.forEach(fabric => {
          const skc = fabric.sku_code || fabric.skuCode || '';
          if (!skcGroups[skc]) skcGroups[skc] = [];
          skcGroups[skc].push(fabric);
        });

        Object.keys(skcGroups).sort().forEach(skc => {
          const skcItems = skcGroups[skc];
          const pdtColorName = skcItems[0].pdt_color_name || '';
          const { main } = getSkuInfoSegments(skcItems.map(f => ({ itemId: '', fabric: f })));
          const m = main ? main.fabric : skcItems[0];

          // 最大单量（仅共享面料）
          let sharedInfo = null;
          if (sharedMap && sharedMap.size > 0) {
            const key = (m.mt_code || '') + '||' + (m.mt_spec_name || '');
            if (sharedMap.has(key)) sharedInfo = sharedMap.get(key);
          }
          const maxNum = sharedInfo && sharedInfo.maxMap ? sharedInfo.maxMap[skc] || 0 : 0;
          const splitFallback = (sharedInfo && sharedInfo.splitPieces > 0) ? sharedInfo.splitPieces : 0;

          const batchRows = (p, d) => {
            if (p > 0 || d > 0) {
              rows.push([pdtCode, skc, p || '', d > 0 ? `${d}天之内` : '', maxNum || '', liveDate, pdtColorName]);
            }
          };

          // 统一只从 sales_batches 取；旧数据若 batches 为空但主行有值，自动补一个
          let batches = Array.isArray(m.sales_batches) ? m.sales_batches.slice() : [];
          if (batches.length === 0 && ((m.sales_pieces || 0) > 0 || (m.sales_delivery_days || 0) > 0)) {
            batches = [{ pieces: m.sales_pieces || 0, days: m.sales_delivery_days || 0 }];
          }
          // 防御性去重：相邻且 pieces/days 完全相同的批次只保留一个
          batches = batches.filter((b, i, arr) => {
            if (i === 0) return true;
            const prev = arr[i - 1];
            return !(((b.pieces || 0) === (prev.pieces || 0)) && ((b.days || 0) === (prev.days || 0)));
          });

          // 每个批次一行；第1批件数为0且有分摊量兜底时用分摊量
          batches.forEach((b, i) => {
            let p = b.pieces || 0;
            const d = b.days || 0;
            if (i === 0 && p === 0 && splitFallback > 0) p = splitFallback;
            batchRows(p, d);
          });
        });
      });

      const BOM = '﻿';
      const csvContent = BOM + [headers, ...rows].map(row => row.join(',')).join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `翻单信息汇总_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>

  <!-- 直播日期选择弹窗 -->
  <div class="modal-overlay" id="liveDateModal">
    <div class="modal-content">
      <h3>请输入直播日期</h3>
      <p>选择导出后要填入「直播日期」列的日期</p>
      <input type="date" id="liveDateInput"
        style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:16px; box-sizing:border-box;">
      <div class="modal-actions">
        <button type="button" class="btn-recommended" onclick="confirmLiveDate()">确定并导出</button>
        <button type="button" class="btn-cancel" onclick="cancelLiveDate()">取消</button>
      </div>
    </div>
  </div>
</body>
